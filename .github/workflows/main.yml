name: Test GitHub Actions Workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test code and model quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Workflow completed successfully
        run: echo "GitHub Actions workflow is working successfully!"
